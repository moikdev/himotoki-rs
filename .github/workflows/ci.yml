name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace

  windows:
    name: Windows build + unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p himotoki-cli -p himotoki-load
      - run: cargo test -p himotoki-core --lib

  msrv:
    name: MSRV (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  golden:
    name: build DB + golden parity + integration tests
    runs-on: ubuntu-latest
    env:
      HIMOTOKI_DB_PATH: ${{ github.workspace }}/data/himotoki.db
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --release -p himotoki-load -p himotoki-cli
      - name: Build database from data/
        run: |
          target/release/himotoki-load jmdict data/JMdict_e.xml --db "$HIMOTOKI_DB_PATH"
          target/release/himotoki-load conj --db "$HIMOTOKI_DB_PATH" --data-dir data
          target/release/himotoki-load errata --db "$HIMOTOKI_DB_PATH"
      - name: Golden parity
        run: |
          target/release/himotoki dump --inputs tests/golden/inputs.jsonl --out /tmp/rust-gold
          python scripts/diff_gold.py --rust /tmp/rust-gold --normalize-ids
      - name: Integration tests
        run: cargo test --release --workspace
      - name: Python bindings
        run: |
          python -m pip install maturin pytest
          (cd crates/himotoki-py && maturin build --release -o dist)
          python -m pip install crates/himotoki-py/dist/*.whl
          python -m pytest -q crates/himotoki-py/tests
